name: Password-protected preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'preview-tests/**'
      - 'playwright*.js'
      - 'server/**'
      - 'scripts/**'
      - 'index.html'
      - 'package*.json'
      - 'vite.preview.config.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - name: Browser tests
        shell: bash
        run: npm run test:browser 2>&1 | tee /tmp/engstien-browser-tests.log
      - name: Browser diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '### Browser test diagnostics'
            echo '```text'
            tail -n 180 /tmp/engstien-browser-tests.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:preview
      - name: Build encrypted preview
        run: npm run build:pages
        env:
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .preview/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
