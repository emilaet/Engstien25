name: Password-protected preview

on:
  workflow_dispatch:
    inputs:
      full_suite:
        description: Run every browser test before publishing
        type: boolean
        default: false
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'browser-tests/**'
      - 'preview-tests/**'
      - 'playwright*.js'
      - 'server/**'
      - 'scripts/**'
      - 'index.html'
      - 'public/**'
      - 'package*.json'
      - 'vite.preview.config.js'
      - '.github/workflows/pages.yml'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 40
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - name: Prepare test browser
        timeout-minutes: 3
        shell: bash
        run: |
          task_browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$task_browser" ]; then
            echo "CHROMIUM_PATH=$task_browser" >> "$GITHUB_ENV"
            "$task_browser" --version
          else
            npx playwright install --with-deps chromium
          fi
      - name: Critical browser tests
        if: github.event_name != 'schedule' && !inputs.full_suite
        shell: bash
        run: npm run test:smoke -- --reporter=github,line 2>&1 | tee /tmp/engstien-browser-tests.log
      - name: Full browser tests
        if: github.event_name == 'schedule' || inputs.full_suite
        shell: bash
        run: npm run test:browser -- --reporter=github,line 2>&1 | tee /tmp/engstien-browser-tests.log
      - name: Browser diagnostics
        if: failure()
        shell: bash
        run: |
          {
            echo '### Browser test diagnostics'
            echo '```text'
            tail -n 180 /tmp/engstien-browser-tests.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run test:preview
      - name: Build encrypted preview
        if: github.ref == 'refs/heads/main'
        run: |
          node scripts/prepare-electricity-tariffs.mjs .electricity-tariffs.json
          npm run build:pages
        env:
          ELECTRICITY_TARIFFS_FILE: .electricity-tariffs.json
          PREVIEW_PASSWORD: ${{ secrets.PREVIEW_PASSWORD }}
          APPLE_MUSIC_TEAM_ID: ${{ secrets.APPLE_MUSIC_TEAM_ID }}
          APPLE_MUSIC_KEY_ID: ${{ secrets.APPLE_MUSIC_KEY_ID }}
          APPLE_MUSIC_PRIVATE_KEY: ${{ secrets.APPLE_MUSIC_PRIVATE_KEY }}
          VITE_GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.GOOGLE_CALENDAR_CLIENT_ID }}
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: .preview/site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
